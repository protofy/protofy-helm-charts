replicaCount: 1

image:
  repository: meshcentral/meshcentral
  pullPolicy: IfNotPresent
  tag: ""

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  ports:
    - sourcePort: 80
      targetPort: 443
      protocol: TCP
      name: http

ingress:
  enabled: false
  className: traefik
  annotations: {}
  hosts: []
  tls: []

persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi   

env: 
  TLS_OFFLOAD: "true"       
  # HOSTNAME: wird über Terraform gesetzt(Ingress-Host)